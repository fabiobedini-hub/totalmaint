# TotalMaint on the Synology DS723+ (Container Manager > Project > Create, point it at this folder)
# or on your PC with Docker Desktop:  docker compose up -d --build
#
# Copy .env.example to .env first and set at least POSTGRES_PASSWORD and SECRET_KEY.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: totalmaint
      POSTGRES_USER: totalmaint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U totalmaint -d totalmaint"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://totalmaint:${POSTGRES_PASSWORD}@db:5432/totalmaint
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      TZ: Europe/Oslo
      REMINDER_HOUR: ${REMINDER_HOUR:-7}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ./data/app:/data
    ports:
      - "8080:8000"
